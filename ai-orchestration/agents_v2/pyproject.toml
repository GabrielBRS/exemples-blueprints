[project]
name = "rag-graph"
version = "0.1.0"
description = "Adaptive/Corrective RAG on-premise com LangGraph 1.2 — Python só como control plane"
requires-python = ">=3.14"

dependencies = [
    # --- orquestração (control plane) -------------------------------------
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=2.0",

    # --- I/O e serialização (C/Rust, não Python) --------------------------
    "httpx>=0.28",
    "orjson>=3.11",
    "uvloop>=0.21",

    # --- dados (hot path fora do Python) ----------------------------------
    "asyncpg>=0.30",
    "pgvector>=0.4",
    "numpy>=2.2",
    "polars>=1.20",
    "tokenizers>=0.21",          # Rust, libera a GIL no encode_batch
    "tritonclient[grpc]>=2.54",

    # --- borda HTTP --------------------------------------------------------
    "fastapi>=0.118",
    "granian>=2.0",              # servidor HTTP em Rust
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# Só instale se for usar a camada LangChain (create_agent, middlewares,
# normalização de tool-calling entre providers). O núcleo NÃO depende dela.
langchain = ["langchain>=1.3,<2", "langchain-openai>=1.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_graph"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"

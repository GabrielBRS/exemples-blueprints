[package]
name = "backend-industrial-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Monolito REST industrial (baremetal) env-aware: .env em dev, Vault (AppRole/KV2) em staging&prod."
license = "MIT"

[dependencies]
# --- HTTP / runtime ---
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "request-id"] }

# --- Banco de dados ---
# Queries em runtime (query_as::<_, T>("...")) para o scaffold compilar SEM banco no ar.
# Ao evoluir para macros compile-time (query!/query_as!), rode `cargo sqlx prepare` e
# habilite o modo offline (arquivo .sqlx/), ou tenha o DATABASE_URL apontando pra um banco.
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }

# --- Serializacao ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Config / ambiente ---
dotenvy = "0.15"

# --- Segredos (staging/prod) ---
vaultrs = "0.8"
vaultrs-login = "0.2"

# --- Observabilidade ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Erros ---
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

# --- Tipos de dominio ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
health = "0.2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "backend-minimal-no-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Monolito REST minimal (baremetal, no-vault): Axum + Tokio + SQLx + dotenv, tudo em um arquivo."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
